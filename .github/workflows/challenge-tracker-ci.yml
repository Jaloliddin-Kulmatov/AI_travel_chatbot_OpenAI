name: Challenge Tracker CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: challenge-tracker } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: challenges }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@127.0.0.1:5432/challenges
      TEST_DATABASE_URL: postgres://app:app@127.0.0.1:5432/challenges_test
      E2E_DATABASE_URL: postgres://app:app@127.0.0.1:5432/challenges_e2e
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: challenge-tracker/package-lock.json }
      - run: npm ci
      - run: PGPASSWORD=app psql -h 127.0.0.1 -U app -d postgres -c "create database challenges_test" -c "create database challenges_e2e"
      - run: npm run typecheck
      - run: npm run test:all
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
